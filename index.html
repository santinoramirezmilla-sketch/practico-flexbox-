
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explorá - Tu próxima aventura</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- ENCABEZADO: navegación organizada con Flexbox -->
    <header class="encabezado">
        <h2 class="logo">Explorá.</h2>
        <nav class="menu">
            <a href="#inicio">Inicio</a>
            <a href="#destinos">Destinos</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <!-- PORTADA: contenido centrado con Flexbox -->
    <section class="portada" id="inicio">
        <div class="contenido">
            <h1>Tu próxima aventura comienza acá</h1>
            <p>Descubrí lugares increíbles y nuevos destinos.</p>
            <a href="#destinos" class="boton">Ver destinos</a>
        </div>
    </section>

    <!-- GALERÍA: tarjetas organizadas con Flexbox -->
    <section class="destinos" id="destinos">
        <h2>Destinos destacados</h2>

        <div class="galeria">
            <article class="tarjeta">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600" alt="Montañas">
                <h3>Montañas</h3>
                <p>Disfrutá de la naturaleza.</p>
            </article>

            <article class="tarjeta">
                <img src=">
                <h3>Playas</h3>
                <p>Relajate junto al mar.</p>
            </article>

            <article class="tarjeta">
                <img <img src="https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?w=600" alt="Ciudad">
                <h3>Ciudades</h3>
                <p>Explorá nuevos lugares.</p>
            </article>
        </div>
    </section>

    <!-- PIE DE PÁGINA: elementos distribuidos con Flexbox -->
    <footer class="pie" id="contacto">
        <p>© 2026 Explorá - Proyecto Flexbox</p>
        <a href="#inicio">Volver arriba</a>
    </footer>

</body>
</html>
